name: 'Docker Release'

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch: {}

jobs:
    release:
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-latest
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm
        permissions:
            packages: write
            id-token: write
            attestations: write
        steps:
            - name: Enable ZRAM
              # Reduce memory pressure
              # PERCENT=100 is safe: https://fedoraproject.org/wiki/Changes/Scale_ZRAM_to_full_memory_size
              run: |
                  sudo apt-get update -yq
                  sudo apt-get install -yq "linux-modules-extra-$(uname -r)" zram-tools
                  echo -e 'ALGO=zstd\nPERCENT=100' | sudo tee -a /etc/default/zramswap
                  sudo systemctl restart zramswap
                  swapon

            - name: Prepare
              run: |
                  platform=${{ matrix.platform }}
                  echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

            - name: Log in to the Container registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: |
                      ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest,enable=true
                      type=sha,format=long,prefix=,enable=true
                  flavor: latest=false

            - name: Extract image names
              id: image-name
              run: |
                  tags=$(jq -r '.target["docker-metadata-action"].args.DOCKER_META_IMAGES' "$DOCKER_METADATA_OUTPUT_BAKE_FILE_TAGS")
                  echo "tags=$tags" >> "$GITHUB_OUTPUT"

            - name: Build and push Docker image
              id: build-and-push
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  build-args: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=0
                  tags: ${{ steps.image-name.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  platforms: ${{ matrix.platform }}
                  cache-from: |
                      type=registry,ref=ghcr.io/${{ github.repository }}:latest
                  cache-to: type=inline,ref=ghcr.io/${{ github.repository }}:latest # inline cache is enough
                  outputs: type=image,compression=zstd,force-compression=true,push-by-digest=true,name-canonical=true,push=true

            - name: Attest
              uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
              with:
                  subject-name: |
                      ghcr.io/${{ github.repository }}
                  subject-digest: ${{ steps.build-and-push.outputs.digest }}

            - name: Export digest
              run: |
                  mkdir -p ${{ runner.temp }}/digests
                  digest="${{ steps.build-and-push.outputs.digest }}"
                  touch "${{ runner.temp }}/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: digests-${{ env.PLATFORM_PAIR }}
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        runs-on: ubuntu-latest
        needs: release
        timeout-minutes: 5
        permissions:
            packages: write
            id-token: write
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

            - name: Log in to the Container registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Download digests
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Extract Docker metadata
              id: meta-merge
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: |
                      ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest,enable=true
                      type=sha,format=long,prefix=,enable=true
                  flavor: latest=false

            - name: Create manifest list and push
              working-directory: ${{ runner.temp }}/digests
              run: |
                  repo_lower="${GITHUB_REPOSITORY,,}" # docker references must be lowercase
                  docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                      $(printf "ghcr.io/${repo_lower}@sha256:%s " *)
