name: 'Docker Release'

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch: {}

jobs:
    release:
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-latest
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm
        permissions:
            packages: write
            id-token: write
            attestations: write
        steps:
            - name: Enable ZRAM
              # Reduce memory pressure
              # PERCENT=100 is safe: https://fedoraproject.org/wiki/Changes/Scale_ZRAM_to_full_memory_size
              run: |
                  sudo apt-get update -yq
                  sudo apt-get install -yq zram-tools
                  # TODO: remove when runner is 26.0
                  modinfo zram > /dev/null 2>&1 || sudo apt-get install -yq "linux-modules-extra-$(uname -r)"
                  echo -e 'ALGO=zstd\nPERCENT=100' | sudo tee -a /etc/default/zramswap
                  sudo systemctl restart zramswap
                  swapon

            - name: Prepare
              run: |
                  platform=${{ matrix.platform }}
                  echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

            - name: Log in to the Container registry
              uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: |
                      ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest,enable=true
                      type=sha,format=long,prefix=,enable=true
                  flavor: latest=false

            - name: Extract image names
              id: image-name
              run: |
                  tags=$(jq -r '.target["docker-metadata-action"].args.DOCKER_META_IMAGES' "$DOCKER_METADATA_OUTPUT_BAKE_FILE_TAGS")
                  echo "tags=$tags" >> "$GITHUB_OUTPUT"

            - name: Build and push Docker image
              id: build-and-push
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  build-args: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=0
                  tags: ${{ steps.image-name.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  platforms: ${{ matrix.platform }}
                  cache-from: |
                      type=registry,ref=ghcr.io/${{ github.repository }}:latest
                  cache-to: type=inline,ref=ghcr.io/${{ github.repository }}:latest # inline cache is enough
                  outputs: type=image,compression=zstd,force-compression=true,push-by-digest=true,name-canonical=true,push=true

            - name: Attest
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-name: |
                      ghcr.io/${{ github.repository }}
                  subject-digest: ${{ steps.build-and-push.outputs.digest }}

            - name: Export digest
              run: |
                  mkdir -p ${{ runner.temp }}/digests
                  digest="${{ steps.build-and-push.outputs.digest }}"
                  touch "${{ runner.temp }}/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: digests-${{ env.PLATFORM_PAIR }}
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        runs-on: ubuntu-latest
        needs: release
        timeout-minutes: 5
        permissions:
            packages: write
            id-token: write
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

            - name: Log in to the Container registry
              uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Download digests
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Extract Docker metadata
              id: meta-merge
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: |
                      ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest,enable=true
                      type=sha,format=long,prefix=,enable=true
                  flavor: latest=false

            - name: Create manifest list and push
              working-directory: ${{ runner.temp }}/digests
              run: |
                  repo_lower="${GITHUB_REPOSITORY,,}" # docker references must be lowercase
                  docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                      $(printf "ghcr.io/${repo_lower}@sha256:%s " *)
